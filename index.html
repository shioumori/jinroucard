<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100d25">
  <meta name="description" content="役職とカードで真実を探る、ワンナイト正体隠匿ゲーム。">
  <title>夜明け前 — ワンナイト・カードゲーム</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="夜明け前 ホーム"><span class="brand-mark">✦</span><span>夜明け前</span></a>
      <button class="icon-button help-button" id="helpButton" aria-label="説明を開く"><img src="./assets/icons/help.png" alt=""></button>
    </header>

    <main id="app" class="main-content"></main>

    <footer class="footer"><span>ONE NIGHT, MANY STORIES</span><button id="rulesLink">遊び方・役職・カード</button></footer>
  </div>
  <dialog id="rulesDialog" class="rules-dialog">
    <div class="dialog-head"><div><span class="eyebrow">QUICK GUIDE</span><h2>ゲームガイド</h2></div><button class="icon-button close-dialog" aria-label="閉じる">×</button></div>
    <div class="guide-tabs"><button class="guide-tab active" data-guide="roles"><img src="./assets/icons/village.png" alt="">役職</button><button class="guide-tab" data-guide="cards"><img src="./assets/icons/submit.png" alt="">カード</button><button class="guide-tab" data-guide="flow"><img src="./assets/icons/help.png" alt="">遊び方</button></div>
    <div id="guideContent" class="guide-content"></div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
